---
name: RPC Limits
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: '0 10 * * *'
      timezone: 'Europe/Belgrade'
  workflow_dispatch:

concurrency:
  group: rpc-limits
  cancel-in-progress: false

jobs:
  rpc_limits:
    name: Probe ${{ matrix.network }} RPC limits
    runs-on: ubuntu-latest
    strategy:
      # One cluster changing its limits says nothing about the other, so a
      # failure on one must not cancel the other's report.
      fail-fast: false
      matrix:
        include:
          - network: devnet
            test: TestDevnetRPCMethodLimits
            gate: SOLANA_DEVNET_RATE_LIMIT_TEST
          - network: mainnet
            test: TestMainnetRPCMethodLimits
            gate: SOLANA_MAINNET_RATE_LIMIT_TEST
    # The sweep spends one 10s window and 15s of silence per method, so it takes
    # about six minutes of wall clock for fourteen methods.
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5.0.0
        with:
          go-version: 1.27.3
      - name: Probe ${{ matrix.network }} rate limits
        env:
          PROBE_GATE: ${{ matrix.gate }}
          PROBE_TEST: ${{ matrix.test }}
        run: |
          set -o pipefail
          env "$PROBE_GATE=1" go test ./common/ -run "^${PROBE_TEST}\$" \
            -count=1 -v -timeout 15m 2>&1 | tee probe.log
      - name: Report what the node allows
        if: always()
        env:
          NETWORK: ${{ matrix.network }}
        run: |
          {
            echo "## ${NETWORK^} per-method limits"
            echo
            echo '```'
            sed -n '/method  *configured/,/^ *$/p' probe.log
            echo '```'
            echo
            grep -oE '(UNDER|OVER):.*' probe.log | sed 's/^/- /' \
              || echo "Every method matches ${NETWORK}LimitsConfig."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the probe log
        if: always()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: ${{ matrix.network }}-rpc-limits-log
          path: probe.log
          retention-days: 30
